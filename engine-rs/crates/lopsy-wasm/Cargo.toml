[package]
name = "lopsy-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Rust 1.87+ emits bulk-memory / sign-ext / nontrapping-fptoint by
# default; wasm-opt must be told they are allowed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int", "--enable-mutable-globals"]

[dependencies]
lopsy-core = { path = "../lopsy-core" }
lopsy-engine = { path = "../lopsy-engine" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "HtmlCanvasElement",
    "console",
]
