[package]
name = "lopsy-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode", "frame"] }

[dev-dependencies]
jpeg-encoder = "0.6"
jpeg-decoder = "0.3"
