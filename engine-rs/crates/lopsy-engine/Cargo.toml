[package]
name = "lopsy-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
lopsy-core = { path = "../lopsy-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }
swash = "0.1"
skrifa = "0.22"
etagere = "0.2"
brotli = { version = "3", default-features = false, features = ["std"] }

[build-dependencies]
lopsy-shaderc = { path = "../lopsy-shaderc" }

[dependencies.web-sys]
version = "0.3"
features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlFramebuffer",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "WebGlActiveInfo",
    "WebGlVertexArrayObject",
    "ImageBitmap",
]
