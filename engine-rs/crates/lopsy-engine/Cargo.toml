[package]
name = "lopsy-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
lopsy-core = { path = "../lopsy-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlFramebuffer",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "WebGlActiveInfo",
    "WebGlVertexArrayObject",
    "ImageBitmap",
]
