[package]
name = "lopsy-engine"
version = "0.1.0"
edition = "2021"

[features]
# Build the wgpu backend (gpu/wgpu) in place of the WebGL one (gpu/webgl).
# The two are never compiled together: see gpu/mod.rs.
wgpu = ["dep:wgpu"]
# The wgpu backend on a real GPU outside the browser: Metal, Vulkan or
# DX12. For render tests (`cargo test --features native`) and hosts that
# are not a web page. The wasm build never enables it.
native = ["wgpu", "wgpu/metal", "wgpu/vulkan", "wgpu/dx12"]

[dependencies]
lopsy-core = { path = "../lopsy-core" }
# WebGPU only. wgpu's own WebGL backend would add about 3 MB to the wasm
# (docs/engine-migration-plan.md, spike S1); the hand-written one in
# gpu/webgl is the fallback. 30.0.1 was released 2026-08-22.
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "webgpu", "wgsl"] }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }
swash = "0.1"
skrifa = "0.22"
etagere = "0.2"
brotli = { version = "3", default-features = false, features = ["std"] }

# Render tests on a real GPU; see the file's header.
[[test]]
name = "render"
required-features = ["native"]

[build-dependencies]
lopsy-shaderc = { path = "../lopsy-shaderc" }

[dependencies.web-sys]
version = "=0.3.107"
features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlFramebuffer",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "WebGlActiveInfo",
    "WebGlVertexArrayObject",
    "ImageBitmap",
]
