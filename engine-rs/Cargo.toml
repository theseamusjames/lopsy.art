[workspace]
resolver = "2"
members = [
    "crates/lopsy-core",
    "crates/lopsy-wasm",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwinding cannot cross the WASM boundary anyway — abort keeps the
# binary smaller and failure behavior explicit.
panic = "abort"
strip = true
