[package]
name = "lopsy-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode", "frame"] }
# Reads the JPEG preview a Sony ARW embeds, to match its exposure. Pinned;
# default features off (no rayon threads, which wasm cannot use).
jpeg-decoder = { version = "=0.3.2", default-features = false }

[dev-dependencies]
jpeg-encoder = "0.6"
