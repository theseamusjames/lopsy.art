[package]
name = "lopsy-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Rust 1.87+ emits bulk-memory / sign-ext / nontrapping-fptoint by
# default; wasm-opt must be told they are allowed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int", "--enable-mutable-globals"]

[features]
# `createEngine` is async on wgpu: WebGPU hands out its device through a
# promise.
wgpu = ["lopsy-engine/wgpu", "dep:wasm-bindgen-futures"]

[dependencies]
lopsy-core = { path = "../../core" }
lopsy-engine = { path = "../.." }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
wasm-bindgen-futures = { version = "=0.4.80", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "=0.3.107"
features = [
    "HtmlCanvasElement",
    "console",
    "CustomEvent",
    "CustomEventInit",
    "Event",
    "EventTarget",
    "Window",
]
