name: PR Checks

on:
  pull_request:
  push:
    branches-ignore: [main]

# Cancel in-progress runs for the same ref when a new push arrives.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorial-projects:
    name: Tutorial projects on R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Plain Node, no install: the script only uses built-ins.
      - run: npm run tutorial:check

  wasm-build:
    name: Build WASM engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Both builds: Photonamous runs WebGPU by default and WebGL where it is
      # not offered. The key's prefix changed when pkg-wgpu joined, so no
      # entry holding pkg alone is restored.
      - name: Cache WASM pkg output
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/lopsy-web/src/engine-wasm/pkg
            apps/lopsy-web/src/engine-wasm/pkg-wgpu
          key: wasm-pkgs-${{ hashFiles('engine/**/*.rs', 'engine/**/Cargo.toml', 'engine/**/Cargo.lock', 'engine/**/*.wgsl') }}

      - name: Cache cargo registry, git, and target
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install wasm-pack
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: npm run wasm:build

      - name: Check engine bundle size
        run: npm run wasm:size

      # The wgpu backend: Lopsy loads it for ?renderer=wgpu, Photonamous by
      # default. Its size is shown as it grows.
      - name: Build WASM (wgpu backend)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: npm run wasm:build:wgpu

      - name: Show wgpu bundle size
        run: wc -c apps/lopsy-web/src/engine-wasm/pkg-wgpu/lopsy_wasm_bg.wasm apps/lopsy-web/src/engine-wasm/pkg-wgpu/lopsy_wasm.js

      - name: Upload WASM pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: apps/lopsy-web/src/engine-wasm/pkg
          retention-days: 1

      - name: Upload WASM pkg-wgpu artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg-wgpu
          path: apps/lopsy-web/src/engine-wasm/pkg-wgpu
          retention-days: 1

  rust-test:
    name: Rust tests (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('engine/**/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-

      # Plain Node, no install: the script only runs cargo.
      - run: npm run wasm:test

      # The wgpu backend's own tests: every uniform struct against the
      # layout naga computed for its shader, and the render tests, which
      # skip themselves on a runner with no GPU.
      - name: Rust tests (wgpu backend)
        run: npm run wasm:test:wgpu

  wgsl-check:
    name: WGSL compiles on WebGPU
    # Not `ubuntu-latest`: the pinned Playwright installs no Chromium on
    # Ubuntu 26.04, which that label now gives ("Playwright does not
    # support chromium on ubuntu26.04-x64"). Move this with Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-shaderc-${{ runner.os }}-${{ hashFiles('engine/**/Cargo.lock') }}
          restore-keys: |
            cargo-shaderc-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # naga accepting a shader does not prove WebGPU will: see the script.
      - run: npm run wgsl:check

  lint:
    name: Lint (ESLint + pixel-debt)
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download WASM pkg artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: apps/lopsy-web/src/engine-wasm/pkg
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download WASM pkg artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: apps/lopsy-web/src/engine-wasm/pkg
      - run: npm run typecheck

  photos:
    name: Photonamous (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download WASM pkg artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: apps/lopsy-web/src/engine-wasm/pkg
      # The app imports the wgpu build's glue too (@lopsy/engine-pkg-wgpu, the RAF workers).
      - name: Download WASM pkg-wgpu artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg-wgpu
          path: apps/lopsy-web/src/engine-wasm/pkg-wgpu
      # Each of these checks packages/ui (@lopsy/ui, which Lopsy uses too) first.
      - run: npm run typecheck:photos
      - run: npm run lint:photos
      - run: npm run test:photos
      - run: npm run typecheck -w @lopsy/handoff
      - run: npm run lint -w @lopsy/handoff
      - run: npm run test -w @lopsy/handoff

  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download WASM pkg artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: apps/lopsy-web/src/engine-wasm/pkg
      - run: npm run test
