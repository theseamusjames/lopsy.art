name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The last deploy to finish becomes production, so overlapping runs can put an
# older commit live. Run one at a time; a queued run is replaced by a newer one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: npm ci

      # Lopsy Photos ships inside lopsy.art at /photos/ only once the owner
      # sets the repository variable DEPLOY_PHOTOS to 'true' (Settings >
      # Secrets and variables > Actions > Variables). Until then this job
      # builds and publishes Lopsy exactly as before, and production does
      # not change. See docs/photonamous-spec.md, 6.3.
      - name: Build Lopsy
        if: vars.DEPLOY_PHOTOS != 'true'
        run: npm run build

      # The Google settings are public identifiers, not secrets: they ship in
      # the page. Without the client ID, Photos offers local storage only.
      - name: Build the site (Lopsy at /, Lopsy Photos at /photos/)
        if: vars.DEPLOY_PHOTOS == 'true'
        run: npm run build:site
        env:
          # Lopsy offers the handoff (File > Add to Lopsy Photos, ?photos-handoff=)
          # only when its build names Photos' URL.
          VITE_PHOTOS_URL: /photos/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.PHOTOS_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.PHOTOS_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.PHOTOS_GOOGLE_APP_ID }}

      # Tutorial projects live only in R2 (uploaded with `npm run
      # tutorial:upload`), so no published link may point at a missing one.
      - name: Check tutorial projects are on R2
        run: npm run tutorial:check

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ vars.DEPLOY_PHOTOS == 'true' && 'dist' || 'apps/lopsy-web/dist' }} --project-name=lopsy-art
