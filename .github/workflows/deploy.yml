name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The last deploy to finish becomes production, so overlapping runs can put an
# older commit live. Run one at a time; a queued run is replaced by a newer one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Lopsy (lopsy.art) and Photonamous (photonamous.com) are two Pages projects.
# Photonamous is built and deployed only once the owner sets the repository
# variable DEPLOY_PHOTONAMOUS to 'true' (Settings > Secrets and variables >
# Actions > Variables); until then this job publishes Lopsy exactly as
# before. Setup: docs/photonamous-setup.md, section 4.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: npm ci

      # Lopsy offers the handoff (File > Add to Photonamous, Grade in
      # Photonamous, ?photos-handoff=) only when its build names Photonamous'
      # URL, and trusts only that origin.
      - name: Build Lopsy
        run: npm run build
        env:
          VITE_PHOTONAMOUS_URL: ${{ vars.DEPLOY_PHOTONAMOUS == 'true' && (vars.PHOTONAMOUS_URL || 'https://photonamous.com/') || '' }}

      # Tutorial projects live only in R2 (uploaded with `npm run
      # tutorial:upload`), so no published link may point at a missing one.
      - name: Check tutorial projects are on R2
        run: npm run tutorial:check

      - name: Deploy Lopsy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/lopsy-web/dist --project-name=lopsy-art

      # After Lopsy, so a failing Photonamous step never holds Lopsy back. It
      # reuses the engine Lopsy's build compiled. The Google settings are
      # public identifiers, not secrets: they ship in the page. Without the
      # client ID, Photonamous offers local storage only.
      - name: Build Photonamous
        if: vars.DEPLOY_PHOTONAMOUS == 'true'
        run: npm run build:photos
        env:
          VITE_LOPSY_URL: ${{ vars.LOPSY_URL || 'https://lopsy.art/' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.PHOTONAMOUS_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.PHOTONAMOUS_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.PHOTONAMOUS_GOOGLE_APP_ID }}

      - name: Deploy Photonamous to Cloudflare Pages
        if: vars.DEPLOY_PHOTONAMOUS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/photonamous/dist --project-name=${{ vars.PHOTONAMOUS_PAGES_PROJECT || 'photonamous' }}
