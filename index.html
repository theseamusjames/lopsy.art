    <!--
      The editor isn't usable on a phone, so a phone's first visit goes to the
      tutorials instead. Inline so it runs before the app bundle downloads.
      `?welcome` must match WELCOME_PARAM in src/site/tutorials/site-config.ts.
      A link that opens a project (`?open=`, OPEN_PROJECT_PARAM in the same
      file) asked for the editor, so it isn't redirected.
    -->
    <script>
      (function () {
        if (location.pathname !== '/') return;
        if (new URLSearchParams(location.search).has('open')) return;
        var isPhone = matchMedia('(pointer: coarse)').matches
          && Math.min(screen.width, screen.height) < 768;
        if (!isPhone) return;
        var key = 'lopsy:mobile-welcome-shown';
        try {
          if (localStorage.getItem(key)) return;
          localStorage.setItem(key, '1');
        } catch (e) {
          // Without storage we can't remember the visit, and redirecting on
          // every load would lock the phone out of the editor for good.
          return;
        }
        location.replace('/tutorials/?welcome');
      })();
    </script>
